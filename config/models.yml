llm_provider: llm_opensource  # cual de los 3 bloques llm_* de abajo esta activo por defecto

llm_opensource:
  provider: ollama
  deployment_name: qwen2.5:7b-instruct
  temperature: 0.2

llm_nano:
  provider: azure
  deployment_name: o4-mini
  temperature: null  # reasoning model, rejects a custom temperature

llm_gpt:
  provider: azure
  deployment_name: gpt-4
  temperature: 0

retrieval:
  semantic_k: 30          # top-k por búsqueda semántica (FAISS), a nivel de chunk
  keyword_k: 30           # top-k por búsqueda léxica (BM25), a nivel de chunk
  rrf_k: 60               # constante k de Reciprocal Rank Fusion (chunk y facet level)
  shortlist_size: 15      # nº de candidatos que pasan de la fusión a construir evidencia/rerank
  max_evidence_per_candidate: 3  # tope de fragmentos de evidencia por candidato (nunca por debajo del nº de facets)
  default_top_n: 10       # nº de candidatos devueltos al final si no se especifica
  retrieval_mode: hybrid  # semantic | keyword | hybrid — "hybrid" es el default recomendado (nunca fue el peor en la evaluación)
  use_rerank: false       # desactivado por defecto — el rerank empeoró los resultados en la evaluación (3 pools x 2 ground truths)
  reranker:
    default_model: BAAI/bge-reranker-v2-m3
    alternative_model: cross-encoder/ms-marco-MiniLM-L-12-v2
  candidate_id_field: id           # campo de metadata que identifica al candidato en cada chunk
  chunk_id_field: id_chunk         # campo de metadata que identifica cada chunk

embeddings:
  model:
    provider: huggingface
    model_name: BAAI/bge-m3
    embedding_dimension: 1024
  indexers:
    index_name_KB:
      index_name: resumes
      description: Index where each element is a canditate's work experience and the respective metadata
      provider: huggingface
      model_name: BAAI/bge-m3